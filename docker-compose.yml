services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: goalsac
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d goalsac"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Next.js product app (canonical target during migration)
  app:
    build:
      context: .
      dockerfile: artifacts/marketing-persona-app/Dockerfile
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/goalsac
      AUTH_SECRET: local-compose-auth-secret-not-for-shared-use-1234567890ab
      NEXTAUTH_URL: http://localhost:3001
      GEMINI_KEY_ENCRYPTION_SECRET: local-compose-encryption-secret-not-shared-1234
    env_file:
      - path: .env
        required: false
    depends_on:
      postgres:
        condition: service_healthy
    init: true
    restart: unless-stopped

  # Legacy Express API — opt-in via `docker compose --profile legacy up`
  api-server:
    profiles: ["legacy"]
    build:
      context: .
      dockerfile: artifacts/api-server/Dockerfile
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/goalsac
      APP_ORIGIN: http://localhost:5173,http://localhost:3001
      JWT_SECRET: local-compose-jwt-secret-not-for-shared-use-1234
      GEMINI_KEY_ENCRYPTION_SECRET: local-compose-encryption-secret-not-shared-1234
    env_file:
      - path: .env
        required: false
    depends_on:
      postgres:
        condition: service_healthy
    init: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # Legacy Vite product app — redirects to Next; opt-in via `--profile legacy`
  goals-ac:
    profiles: ["legacy"]
    build:
      context: .
      dockerfile: artifacts/goals-ac/Dockerfile
    ports:
      - "5173:8080"
    depends_on:
      api-server:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

  # New standalone pg-boss worker (preferred for background jobs)
  worker:
    build:
      context: .
      dockerfile: artifacts/worker/Dockerfile
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/goalsac
      GEMINI_KEY_ENCRYPTION_SECRET: local-compose-encryption-secret-not-shared-1234
    env_file:
      - path: .env
        required: false
    depends_on:
      postgres:
        condition: service_healthy
    init: true
    restart: unless-stopped

volumes:
  pgdata:
