services:
  shopify-app:
    build: .
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - SHOPIFY_API_KEY=${SHOPIFY_API_KEY}
      - SHOPIFY_API_SECRET=${SHOPIFY_API_SECRET}
      - GOALS_AC_HMAC_KEY=${GOALS_AC_HMAC_KEY}
      - SHOPIFY_DEFAULT_BLOG_ID=${SHOPIFY_DEFAULT_BLOG_ID}
    env_file:
      - .env
    restart: unless-stopped

  # Optional: ngrok tunnel for local development
  # Uncomment and configure for Shopify OAuth flow
  # tunnel:
  #   image: wernight/ngrok:latest
  #   command: ngrok http shopify-app:3001
  #   ports:
  #     - "4040:4040"
  #   depends_on:
  #     - shopify-app
