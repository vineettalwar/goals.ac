name = "goals.ac SEO Content"
client_id = "{{ SHOPIFY_API_KEY }}"
application_url = "https://your-app-url.ngrok.io"
handle = "goals-ac-seo-content"

[access_scopes]
scopes = "read_content,write_content,read_articles,write_articles,read_blogs,read_script_tags,write_script_tags"

[auth]
redirect_urls = [
  "https://your-app-url.ngrok.io/auth/callback",
  "https://your-app-url.ngrok.io/auth/shopify/callback"
]

[webhooks]
api_version = "2026-07"

  [[webhooks.subscriptions]]
  topic = "app/uninstalled"
  uri = "/webhooks/app/uninstalled"

[app_proxy]
requests = [
  { url = "/goals-ac/*", action = "allow" }
]

[pos]
embedded = false
