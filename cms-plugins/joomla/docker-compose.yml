version: "3.8"

services:
  db:
    image: mariadb:10.11
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: joomla
      MYSQL_USER: joomla
      MYSQL_PASSWORD: joomla
    volumes:
      - joomla-db:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  joomla:
    image: joomla:5.3-php8.2-apache
    depends_on:
      db:
        condition: service_healthy
    environment:
      JOOMLA_DB_HOST: db
      JOOMLA_DB_NAME: joomla
      JOOMLA_DB_USER: joomla
      JOOMLA_DB_PASSWORD: joomla
      JOOMLA_DB_DRIVER: mysqli
    ports:
      - "8080:80"
    volumes:
      - joomla-data:/var/www/html
      - ./goalsac.php:/var/www/html/plugins/webservices/goalsac/goalsac.php
      - ./goalsac.xml:/var/www/html/plugins/webservices/goalsac/goalsac.xml
      - ./services:/var/www/html/plugins/webservices/goalsac/services
      - ./src:/var/www/html/plugins/webservices/goalsac/src
      - ./language:/var/www/html/plugins/webservices/goalsac/language
      - ../shared:/var/www/html/plugins/webservices/goalsac/vendor/goals-ac/shared-contract

  nginx:
    image: nginx:1.25-alpine
    depends_on:
      - joomla
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  joomla-db:
  joomla-data:
