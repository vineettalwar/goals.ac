post:
  operationId: syncGscSearchAnalytics
  tags: [seo-tools]
  summary: Sync Google Search Console query data for a project
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
  responses:
    "200":
      description: Sync completed
    "429":
      description: Rate limited
    "502":
      description: Sync failed
get:
  operationId: getGscSyncStatus
  tags: [seo-tools]
  summary: GSC sync status for a project
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
  responses:
    "200":
      description: Sync status
