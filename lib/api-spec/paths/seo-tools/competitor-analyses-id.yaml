get:
  operationId: getCompetitorAnalysis
  tags: [seo-tools]
  summary: Get a saved competitor analysis
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
  responses:
    "200":
      description: Competitor analysis
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CompetitorAnalysisResponse"
    "404":
      description: Not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
