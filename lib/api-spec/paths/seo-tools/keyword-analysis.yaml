post:
  operationId: createKeywordAnalysis
  tags: [seo-tools]
  summary: Analyze keywords with AI
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "#/components/schemas/CreateKeywordAnalysisRequest"
  responses:
    "201":
      description: Keyword analysis result
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/KeywordAnalysisResponse"
    "400":
      description: Invalid input
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    "503":
      description: AI unavailable
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
