get:
  operationId: getKeywordAnalysis
  tags: [seo-tools]
  summary: Get a saved keyword analysis
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
  responses:
    "200":
      description: Keyword analysis
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/KeywordAnalysisResponse"
    "404":
      description: Not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
