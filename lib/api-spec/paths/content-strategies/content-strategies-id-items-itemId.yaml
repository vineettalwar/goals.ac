patch:
  operationId: updateContentItem
  tags: [content-strategies]
  summary: Update a content item status
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
    - name: itemId
      in: path
      required: true
      schema:
        type: integer
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "#/components/schemas/UpdateContentItemRequest"
  responses:
    "200":
      description: Content item updated
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ContentItem"
    "400":
      description: Invalid input
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    "404":
      description: Not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
