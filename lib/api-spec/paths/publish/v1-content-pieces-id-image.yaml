post:
  operationId: attachContentPieceImagePublic
  tags: [publish]
  summary: Attach a licensed stock photo to a piece as its featured image
  description: >-
    Sources a stock photo (Unsplash/Pexels, whichever the project has
    credentials for) matched to the piece's keyword/headings. Requires
    scope image:generate. There is no AI image-generation provider wired
    into goals.ac yet — this is stock search, not text-to-image. Served by
    both the Next.js app (Postgres) and the Cloudflare cf-public-worker
    (D1) deploy targets.
  security:
    - ApiKeyAuth: []
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required: [projectId]
          properties:
            projectId:
              type: integer
  responses:
    "200":
      description: Updated piece with attached featured image
