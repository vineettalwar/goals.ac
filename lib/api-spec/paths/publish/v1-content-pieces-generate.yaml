post:
  operationId: generateContentPiecePublic
  tags: [publish]
  summary: Generate a personalized content draft from the project's brand/dataset
  description: >-
    Runs the same brand-voice / style-vector / research-grounded generator as
    the interactive Studio and persists the result as a draft content piece.
    Requires scope content:generate. Feed the returned id into
    /v1/content/render for a platform-shaped payload (Gutenberg, Elementor,
    LinkedIn, Twitter thread, ...) or into /v1/content-pieces/{id}/publish.
    Served by both the Next.js app (Postgres) and the Cloudflare
    cf-public-worker (D1) deploy targets.
  security:
    - ApiKeyAuth: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required: [projectId, formatType, targetKeyword]
          properties:
            projectId:
              type: integer
            formatType:
              type: string
            targetKeyword:
              type: string
            angleHint:
              type: string
            intendedPublishPlatform:
              type: string
            intendedOutputMode:
              type: string
            intendedEditorMode:
              type: string
              enum: [classic, gutenberg, elementor, divi]
            competitorFocusUrl:
              type: string
            competitorUrls:
              type: array
              items:
                type: string
            cmsCategories:
              type: array
              items:
                type: string
            cmsTags:
              type: array
              items:
                type: string
            plannedDate:
              type: string
            bypassCache:
              type: boolean
  responses:
    "201":
      description: Generated draft content piece
    "409":
      description: Project has no brand voice yet (voice_required)
