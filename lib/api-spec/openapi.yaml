openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: goals.ac API — Programmatic SEO Growth Roadmap Platform
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: publish
    description: Content publish and render API (API key auth)
  - name: roadmaps
    description: Roadmap generation and retrieval
  - name: leads
    description: Lead capture operations
  - name: industries
    description: Industry reference data
  - name: locations
    description: Location reference data
  - name: content-strategies
    description: 30-day content strategy generation and management
  - name: seo-tools
    description: GEO audit, competitor analysis, keyword tracking
  - name: social
    description: Social metrics, history sync, and queue
paths:
  /healthz:
    $ref: "./paths/health/healthz.yaml"
  /roadmaps:
    $ref: "./paths/roadmaps/roadmaps.yaml"
  /roadmaps/generate:
    $ref: "./paths/roadmaps/roadmaps-generate.yaml"
  /roadmaps/{slug}:
    $ref: "./paths/roadmaps/roadmaps-slug.yaml"
  /roadmaps/{slug}/leads:
    $ref: "./paths/leads/roadmaps-slug-leads.yaml"
  /industries:
    $ref: "./paths/industries/industries.yaml"
  /locations:
    $ref: "./paths/locations/locations.yaml"
  /content-strategies/generate:
    $ref: "./paths/content-strategies/content-strategies-generate.yaml"
  /content-strategies:
    $ref: "./paths/content-strategies/content-strategies.yaml"
  /content-strategies/{id}:
    $ref: "./paths/content-strategies/content-strategies-id.yaml"
  /content-strategies/{id}/items/{itemId}:
    $ref: "./paths/content-strategies/content-strategies-id-items-itemId.yaml"
  /geo-audits:
    $ref: "./paths/seo-tools/geo-audits.yaml"
  /geo-audits/{id}:
    $ref: "./paths/seo-tools/geo-audits-id.yaml"
  /competitor-analysis:
    $ref: "./paths/seo-tools/competitor-analysis.yaml"
  /competitor-analyses/{id}:
    $ref: "./paths/seo-tools/competitor-analyses-id.yaml"
  /keyword-analysis:
    $ref: "./paths/seo-tools/keyword-analysis.yaml"
  /keyword-analyses/{id}:
    $ref: "./paths/seo-tools/keyword-analyses-id.yaml"
  /tracked-keywords:
    $ref: "./paths/seo-tools/tracked-keywords.yaml"
  /tracked-keywords/{id}/snapshots:
    $ref: "./paths/seo-tools/tracked-keywords-id-snapshots.yaml"
  /tracked-keywords/{id}:
    $ref: "./paths/seo-tools/tracked-keywords-id.yaml"
  /website-projects/{id}/search-properties/gsc/sync:
    $ref: "./paths/seo-tools/website-projects-id-search-properties-gsc-sync.yaml"
  /website-projects/{id}/gsc-queries:
    $ref: "./paths/seo-tools/website-projects-id-gsc-queries.yaml"
  /website-projects/{id}/social/history-sync:
    $ref: "./paths/social/website-projects-id-social-history-sync.yaml"
  /website-projects/{id}/social/metrics:
    $ref: "./paths/social/website-projects-id-social-metrics.yaml"
  /website-projects/{id}/social/metrics/sync:
    $ref: "./paths/social/website-projects-id-social-metrics-sync.yaml"
  /website-projects/{id}/social/queue/{pieceId}:
    $ref: "./paths/social/website-projects-id-social-queue-pieceId.yaml"
  /website-projects/{id}/article-ideas/import:
    $ref: "./paths/seo-tools/website-projects-id-article-ideas-import.yaml"
  /website-projects/{id}/article-ideas:
    $ref: "./paths/seo-tools/website-projects-id-article-ideas.yaml"
  /website-projects/{id}/article-idea-sources:
    $ref: "./paths/seo-tools/website-projects-id-article-idea-sources.yaml"
  /website-projects/{id}/article-idea-sources/sync:
    $ref: "./paths/seo-tools/website-projects-id-article-idea-sources-sync.yaml"
  /website-projects/{id}/keyword-opportunities:
    $ref: "./paths/seo-tools/website-projects-id-keyword-opportunities.yaml"
  /keyword-opportunities/{id}:
    $ref: "./paths/seo-tools/keyword-opportunities-id.yaml"
  /v1/connections:
    $ref: "./paths/publish/v1-connections.yaml"
  /v1/content-pieces/generate:
    $ref: "./paths/publish/v1-content-pieces-generate.yaml"
  /v1/content-pieces/generate-with-agents:
    $ref: "./paths/publish/v1-content-pieces-generate-with-agents.yaml"
  /v1/content-pieces/{id}/image:
    $ref: "./paths/publish/v1-content-pieces-id-image.yaml"
  /v1/content/render:
    $ref: "./paths/publish/v1-content-render.yaml"
  /v1/content-pieces/{id}/publish:
    $ref: "./paths/publish/v1-content-pieces-id-publish.yaml"
  /v1/content-pieces:
    $ref: "./paths/publish/v1-content-pieces.yaml"

components:
  securitySchemes:
    ApiKeyAuth:
      type: http
      scheme: bearer
      description: goals.ac API key (gac_…)
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Industry:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        slug:
          type: string
      required:
        - id
        - name
        - slug

    Location:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        slug:
          type: string
        country:
          type: string
      required:
        - id
        - name
        - slug
        - country

    RoadmapPhase:
      type: object
      properties:
        title:
          type: string
        timeframe:
          type: string
        objectives:
          type: array
          items:
            type: string
        tactics:
          type: array
          items:
            type: string
        kpis:
          type: array
          items:
            type: string
      required:
        - title
        - timeframe
        - objectives
        - tactics
        - kpis

    RoadmapContent:
      type: object
      properties:
        executiveSummary:
          type: string
        phases:
          type: array
          items:
            $ref: "#/components/schemas/RoadmapPhase"
      required:
        - executiveSummary
        - phases

    Roadmap:
      type: object
      properties:
        id:
          type: integer
        slug:
          type: string
        industry:
          type: string
        location:
          type: string
        stage:
          type: string
        content:
          $ref: "#/components/schemas/RoadmapContent"
        viewCount:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - slug
        - industry
        - location
        - stage
        - content
        - viewCount
        - createdAt
        - updatedAt

    RoadmapListResponse:
      type: object
      properties:
        roadmaps:
          type: array
          items:
            $ref: "#/components/schemas/RoadmapSummary"
        total:
          type: integer
      required:
        - roadmaps
        - total

    RoadmapSummary:
      type: object
      properties:
        id:
          type: integer
        slug:
          type: string
        industry:
          type: string
        location:
          type: string
        stage:
          type: string
        viewCount:
          type: integer
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - slug
        - industry
        - location
        - stage
        - viewCount
        - createdAt

    GenerateRoadmapRequest:
      type: object
      properties:
        industry:
          type: string
        location:
          type: string
        stage:
          type: string
          enum: [pre-seed, seed, series-a, series-b, growth]
      required:
        - industry
        - location
        - stage

    CaptureLeadRequest:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        companyUrl:
          type: string
      required:
        - name
        - email
        - companyUrl

    CaptureLeadResponse:
      type: object
      properties:
        id:
          type: integer
        message:
          type: string
      required:
        - id
        - message

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    GenerateContentStrategyRequest:
      type: object
      properties:
        roadmap_id:
          type: integer
        industry:
          type: string
        location:
          type: string
        stage:
          type: string
      required:
        - roadmap_id
        - industry
        - location
        - stage

    UpdateContentItemRequest:
      type: object
      properties:
        status:
          type: string
          enum: [draft, prepared, published]
      required:
        - status

    ContentItem:
      type: object
      properties:
        id:
          type: integer
        strategyId:
          type: integer
        day:
          type: integer
        title:
          type: string
        format:
          type: string
        topicAngle:
          type: string
        primaryKeyword:
          type: string
        status:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - strategyId
        - day
        - title
        - format
        - topicAngle
        - primaryKeyword
        - status
        - createdAt

    ContentStrategy:
      type: object
      properties:
        id:
          type: integer
        roadmapId:
          type: integer
        industry:
          type: string
        location:
          type: string
        stage:
          type: string
        month:
          type: integer
        year:
          type: integer
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - roadmapId
        - industry
        - location
        - stage
        - month
        - year
        - createdAt

    ContentStrategyWithItems:
      type: object
      properties:
        id:
          type: integer
        roadmapId:
          type: integer
        industry:
          type: string
        location:
          type: string
        stage:
          type: string
        month:
          type: integer
        year:
          type: integer
        createdAt:
          type: string
          format: date-time
        items:
          type: array
          items:
            $ref: "#/components/schemas/ContentItem"
      required:
        - id
        - roadmapId
        - industry
        - location
        - stage
        - month
        - year
        - createdAt
        - items

    GeoIssue:
      type: object
      properties:
        check:
          type: string
        status:
          type: string
          enum: [pass, fail, warn]
        detail:
          type: string
        fix:
          type: string
      required: [check, status, detail, fix]

    CreateGeoAuditRequest:
      type: object
      properties:
        url:
          type: string
          format: uri
        roadmap_id:
          type: integer
        website_project_id:
          type: integer
      required: [url]

    GeoAudit:
      type: object
      properties:
        id:
          type: integer
        roadmapId:
          type: integer
          nullable: true
        websiteProjectId:
          type: integer
          nullable: true
        url:
          type: string
        geoScore:
          type: integer
        issues:
          type: array
          items:
            $ref: "#/components/schemas/GeoIssue"
        pageTitle:
          type: string
          nullable: true
        metaDescription:
          type: string
          nullable: true
        hasSchemaOrg:
          type: boolean
        schemaTypes:
          type: array
          items:
            type: string
        h1Count:
          type: integer
        imageCount:
          type: integer
        imagesMissingAlt:
          type: integer
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - url
        - geoScore
        - issues
        - hasSchemaOrg
        - schemaTypes
        - h1Count
        - imageCount
        - imagesMissingAlt
        - createdAt

    CreateCompetitorAnalysisRequest:
      type: object
      properties:
        competitorUrl:
          type: string
          format: uri
        industry:
          type: string
        location:
          type: string
        stage:
          type: string
        website_project_id:
          type: integer
      required: [competitorUrl, industry, location, stage]

    CompetitorAnalysisResponse:
      type: object
      properties:
        id:
          type: integer
        competitorName:
          type: string
        summary:
          type: string
        strengths:
          type: array
          items:
            type: string
        weaknesses:
          type: array
          items:
            type: string
        contentGaps:
          type: array
          items:
            type: string
        geoGaps:
          type: array
          items:
            type: string
        quickWins:
          type: array
          items:
            type: string
        threatLevel:
          type: string
          enum: [low, medium, high]
        createdAt:
          type: string
          format: date-time
      required:
        - competitorName
        - summary
        - strengths
        - weaknesses
        - contentGaps
        - geoGaps
        - quickWins
        - threatLevel

    CreateKeywordAnalysisRequest:
      type: object
      properties:
        keywords:
          type: array
          items:
            type: string
          minItems: 1
          maxItems: 10
        websiteUrl:
          type: string
          format: uri
        website_project_id:
          type: integer
      required: [keywords]

    KeywordResult:
      type: object
      properties:
        keyword:
          type: string
        estimatedVolume:
          type: string
        difficulty:
          type: string
          enum: [low, medium, high]
        aiVisibility:
          type: integer
        opportunities:
          type: array
          items:
            type: string
        suggestedContent:
          type: string
      required:
        - keyword
        - estimatedVolume
        - difficulty
        - aiVisibility
        - opportunities
        - suggestedContent

    KeywordAnalysisResponse:
      type: object
      properties:
        id:
          type: integer
        keywords:
          type: array
          items:
            $ref: "#/components/schemas/KeywordResult"
        topOpportunity:
          type: string
        summary:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - keywords
        - topOpportunity
        - summary

    CreateTrackedKeywordRequest:
      type: object
      properties:
        website_project_id:
          type: integer
        keyword:
          type: string
        target_url:
          type: string
          format: uri
        location:
          type: string
        language:
          type: string
        device:
          type: string
          enum: [desktop, mobile]
      required: [website_project_id, keyword]

    TrackedKeyword:
      type: object
      properties:
        id:
          type: integer
        websiteProjectId:
          type: integer
        keyword:
          type: string
        targetUrl:
          type: string
          nullable: true
        location:
          type: string
        language:
          type: string
        device:
          type: string
        isActive:
          type: boolean
        lastCheckedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - websiteProjectId
        - keyword
        - location
        - language
        - device
        - isActive
        - createdAt
        - updatedAt

    KeywordRankSnapshot:
      type: object
      properties:
        id:
          type: integer
        trackedKeywordId:
          type: integer
        position:
          type: integer
          nullable: true
        rankingUrl:
          type: string
          nullable: true
        serpFeatures:
          type: object
          additionalProperties: true
        provider:
          type: string
        checkedAt:
          type: string
          format: date-time
      required:
        - id
        - trackedKeywordId
        - serpFeatures
        - provider
        - checkedAt

    TrackedKeywordWithSnapshot:
      allOf:
        - $ref: "#/components/schemas/TrackedKeyword"
        - type: object
          properties:
            latestSnapshot:
              $ref: "#/components/schemas/KeywordRankSnapshot"
              nullable: true

    TrackedKeywordListResponse:
      type: object
      properties:
        trackedKeywords:
          type: array
          items:
            $ref: "#/components/schemas/TrackedKeywordWithSnapshot"
      required: [trackedKeywords]

    TrackedKeywordSnapshotsResponse:
      type: object
      properties:
        trackedKeyword:
          $ref: "#/components/schemas/TrackedKeyword"
        snapshots:
          type: array
          items:
            $ref: "#/components/schemas/KeywordRankSnapshot"
      required: [trackedKeyword, snapshots]
