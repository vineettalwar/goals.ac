openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: goals.ac API — Programmatic SEO Growth Roadmap Platform
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: publish
    description: Content publish and render API (API key auth)
  - name: roadmaps
    description: Roadmap generation and retrieval
  - name: leads
    description: Lead capture operations
  - name: industries
    description: Industry reference data
  - name: locations
    description: Location reference data
  - name: content-strategies
    description: 30-day content strategy generation and management
  - name: seo-tools
    description: GEO audit, competitor analysis, keyword tracking
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /roadmaps:
    get:
      operationId: listRoadmaps
      tags: [roadmaps]
      summary: List all roadmaps
      description: Returns all generated roadmaps for browsing and SEO directory
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
        - name: industry
          in: query
          schema:
            type: string
        - name: location
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of roadmaps
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoadmapListResponse"

  /roadmaps/generate:
    post:
      operationId: generateRoadmap
      tags: [roadmaps]
      summary: Generate or retrieve a roadmap
      description: Generates a new roadmap using AI for the given parameters, or returns cached if exists
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateRoadmapRequest"
      responses:
        "200":
          description: Roadmap generated or retrieved from cache
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Roadmap"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: AI generation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /roadmaps/{slug}:
    get:
      operationId: getRoadmap
      tags: [roadmaps]
      summary: Get a roadmap by slug
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Roadmap found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Roadmap"
        "404":
          description: Roadmap not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /roadmaps/{slug}/leads:
    post:
      operationId: captureLeadForRoadmap
      tags: [leads]
      summary: Capture a lead for a roadmap
      description: Records a lead's contact details tied to a specific roadmap
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CaptureLeadRequest"
      responses:
        "201":
          description: Lead captured successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaptureLeadResponse"
        "400":
          description: Invalid input (validation error)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Roadmap not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /industries:
    get:
      operationId: listIndustries
      tags: [industries]
      summary: List all industries
      description: Returns all available industries for the roadmap generator form
      responses:
        "200":
          description: List of industries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Industry"

  /locations:
    get:
      operationId: listLocations
      tags: [locations]
      summary: List all locations
      description: Returns all available locations for the roadmap generator form
      responses:
        "200":
          description: List of locations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Location"

  /content-strategies/generate:
    post:
      operationId: generateContentStrategy
      tags: [content-strategies]
      summary: Generate a 30-day content strategy
      description: Generates a new 30-day content strategy using AI for the given roadmap parameters
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateContentStrategyRequest"
      responses:
        "200":
          description: Content strategy generated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentStrategyWithItems"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Roadmap not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: AI generation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /content-strategies:
    get:
      operationId: listContentStrategies
      tags: [content-strategies]
      summary: List all content strategies
      description: Returns all generated content strategies (admin use)
      responses:
        "200":
          description: List of content strategies
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ContentStrategy"

  /content-strategies/{id}:
    get:
      operationId: getContentStrategy
      tags: [content-strategies]
      summary: Get a content strategy with all items
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Content strategy with items
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentStrategyWithItems"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /content-strategies/{id}/items/{itemId}:
    patch:
      operationId: updateContentItem
      tags: [content-strategies]
      summary: Update a content item status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: itemId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateContentItemRequest"
      responses:
        "200":
          description: Content item updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentItem"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /geo-audits:
    post:
      operationId: createGeoAudit
      tags: [seo-tools]
      summary: Run a GEO audit on a URL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGeoAuditRequest"
      responses:
        "201":
          description: GEO audit created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeoAudit"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: URL fetch failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /geo-audits/{id}:
    get:
      operationId: getGeoAudit
      tags: [seo-tools]
      summary: Get a GEO audit by id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: GEO audit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeoAudit"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /competitor-analysis:
    post:
      operationId: createCompetitorAnalysis
      tags: [seo-tools]
      summary: Analyze a competitor URL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCompetitorAnalysisRequest"
      responses:
        "201":
          description: Competitor analysis result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompetitorAnalysisResponse"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: AI unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /competitor-analyses/{id}:
    get:
      operationId: getCompetitorAnalysis
      tags: [seo-tools]
      summary: Get a saved competitor analysis
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Competitor analysis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompetitorAnalysisResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /keyword-analysis:
    post:
      operationId: createKeywordAnalysis
      tags: [seo-tools]
      summary: Analyze keywords with AI
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateKeywordAnalysisRequest"
      responses:
        "201":
          description: Keyword analysis result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeywordAnalysisResponse"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: AI unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /keyword-analyses/{id}:
    get:
      operationId: getKeywordAnalysis
      tags: [seo-tools]
      summary: Get a saved keyword analysis
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Keyword analysis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeywordAnalysisResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /tracked-keywords:
    get:
      operationId: listTrackedKeywords
      tags: [seo-tools]
      summary: List tracked keywords for a project
      parameters:
        - name: projectId
          in: query
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Tracked keywords with latest snapshots
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrackedKeywordListResponse"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createTrackedKeyword
      tags: [seo-tools]
      summary: Add a keyword to rank tracking
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTrackedKeywordRequest"
      responses:
        "201":
          description: Tracked keyword created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrackedKeyword"
        "503":
          description: SERP provider not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /tracked-keywords/{id}/snapshots:
    get:
      operationId: getTrackedKeywordSnapshots
      tags: [seo-tools]
      summary: Get rank history for a tracked keyword
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Rank snapshots
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrackedKeywordSnapshotsResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /tracked-keywords/{id}:
    delete:
      operationId: deleteTrackedKeyword
      tags: [seo-tools]
      summary: Deactivate a tracked keyword
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deactivated
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /website-projects/{id}/search-properties/gsc/sync:
    post:
      operationId: syncGscSearchAnalytics
      tags: [seo-tools]
      summary: Sync Google Search Console query data for a project
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Sync completed
        "429":
          description: Rate limited
        "502":
          description: Sync failed
    get:
      operationId: getGscSyncStatus
      tags: [seo-tools]
      summary: GSC sync status for a project
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Sync status

  /website-projects/{id}/gsc-queries:
    get:
      operationId: listGscQueries
      tags: [seo-tools]
      summary: Aggregated GSC queries for a project
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Query rollup list

  /website-projects/{id}/social/history-sync:
    post:
      operationId: syncSocialHistory
      tags: [social]
      summary: Pull historical posts via OAuth into brand + platform voice
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: platform
          in: query
          schema:
            type: string
        - name: background
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: Sync completed
        "202":
          description: Queued
    get:
      operationId: getSocialHistorySyncStatus
      tags: [social]
      summary: Per-platform OAuth history sync status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Status

  /website-projects/{id}/social/metrics:
    get:
      operationId: getSocialMetrics
      tags: [social]
      summary: Social post performance metrics for a project
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: platform
          in: query
          schema:
            type: string
        - name: days
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Metrics rows and totals

  /website-projects/{id}/social/metrics/sync:
    post:
      operationId: syncSocialMetrics
      tags: [social]
      summary: Sync engagement metrics for published social posts
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: background
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: Sync completed
        "202":
          description: Queued
    get:
      operationId: getSocialMetricsSyncStatus
      tags: [social]
      summary: Social metrics sync status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Status

  /website-projects/{id}/social/queue/{pieceId}:
    patch:
      operationId: scheduleSocialQueuePiece
      tags: [social]
      summary: Schedule or unschedule a social queue item
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: pieceId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Updated content piece

  /website-projects/{id}/article-ideas/import:
    post:
      operationId: importArticleIdeasCsv
      tags: [seo-tools]
      summary: Import article ideas from CSV (site admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Import result
        "403":
          description: Forbidden

  /website-projects/{id}/article-ideas:
    post:
      operationId: createArticleIdeas
      tags: [seo-tools]
      summary: Create manual article ideas (site admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Created

  /website-projects/{id}/article-idea-sources:
    get:
      operationId: listArticleIdeaSources
      tags: [seo-tools]
      summary: List Google Sheets article idea sources
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Source list
    post:
      operationId: createArticleIdeaSource
      tags: [seo-tools]
      summary: Connect a Google Sheets source (site admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "201":
          description: Source created
        "403":
          description: Forbidden
    delete:
      operationId: deleteArticleIdeaSource
      tags: [seo-tools]
      summary: Remove a Google Sheets source
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: sourceId
          in: query
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted

  /website-projects/{id}/article-idea-sources/sync:
    post:
      operationId: syncArticleIdeaSource
      tags: [seo-tools]
      summary: Sync a Google Sheets article idea source now
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Sync result

  /website-projects/{id}/keyword-opportunities:
    post:
      operationId: discoverKeywordOpportunities
      tags: [seo-tools]
      summary: Run keyword opportunity discovery (gsc, semrush, or ai)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Discovery result

  /keyword-opportunities/{id}:
    post:
      operationId: queueKeywordOpportunity
      tags: [seo-tools]
      summary: Queue an opportunity into the content strategy
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Queued
        "400":
          description: No content strategy
    patch:
      operationId: updateKeywordOpportunity
      tags: [seo-tools]
      summary: Update opportunity status (e.g. dismissed)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Updated

        "200":
          description: Updated

  /v1/connections:
    get:
      operationId: listPublishConnections
      tags: [publish]
      summary: List connected publish destinations for a project
      security:
        - ApiKeyAuth: []
      parameters:
        - name: projectId
          in: query
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Connected platforms with adapter capabilities

  /v1/content/render:
    post:
      operationId: renderContentForPlatform
      tags: [publish]
      summary: Render content for a destination without publishing
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [projectId, platform, title, markdown]
              properties:
                projectId:
                  type: integer
                platform:
                  type: string
                title:
                  type: string
                markdown:
                  type: string
                editorMode:
                  type: string
                  enum: [classic, gutenberg, elementor, divi]
      responses:
        "200":
          description: Render preview payload

  /v1/content-pieces/{id}/publish:
    post:
      operationId: publishContentPiecePublic
      tags: [publish]
      summary: Publish a content piece to a connected destination
      security:
        - ApiKeyAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [projectId, platform]
              properties:
                projectId:
                  type: integer
                platform:
                  type: string
      responses:
        "200":
          description: Published

  /v1/content-pieces:
    post:
      operationId: ingestContentDraft
      tags: [publish]
      summary: Validate and return canonical content from external markdown
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [projectId, title, markdown]
              properties:
                projectId:
                  type: integer
                title:
                  type: string
                markdown:
                  type: string
                formatType:
                  type: string
      responses:
        "201":
          description: Canonical content accepted

components:
  securitySchemes:
    ApiKeyAuth:
      type: http
      scheme: bearer
      description: goals.ac API key (gac_…)
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Industry:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        slug:
          type: string
      required:
        - id
        - name
        - slug

    Location:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        slug:
          type: string
        country:
          type: string
      required:
        - id
        - name
        - slug
        - country

    RoadmapPhase:
      type: object
      properties:
        title:
          type: string
        timeframe:
          type: string
        objectives:
          type: array
          items:
            type: string
        tactics:
          type: array
          items:
            type: string
        kpis:
          type: array
          items:
            type: string
      required:
        - title
        - timeframe
        - objectives
        - tactics
        - kpis

    RoadmapContent:
      type: object
      properties:
        executiveSummary:
          type: string
        phases:
          type: array
          items:
            $ref: "#/components/schemas/RoadmapPhase"
      required:
        - executiveSummary
        - phases

    Roadmap:
      type: object
      properties:
        id:
          type: integer
        slug:
          type: string
        industry:
          type: string
        location:
          type: string
        stage:
          type: string
        content:
          $ref: "#/components/schemas/RoadmapContent"
        viewCount:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - slug
        - industry
        - location
        - stage
        - content
        - viewCount
        - createdAt
        - updatedAt

    RoadmapListResponse:
      type: object
      properties:
        roadmaps:
          type: array
          items:
            $ref: "#/components/schemas/RoadmapSummary"
        total:
          type: integer
      required:
        - roadmaps
        - total

    RoadmapSummary:
      type: object
      properties:
        id:
          type: integer
        slug:
          type: string
        industry:
          type: string
        location:
          type: string
        stage:
          type: string
        viewCount:
          type: integer
        createdAt:
          type: string
          format: date-time
      required:
        - id
