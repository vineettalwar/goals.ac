name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm --filter @workspace/api-server run build
      - run: pnpm --filter @workspace/goals-ac run build
      - run: docker compose config --quiet

  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build --file artifacts/api-server/Dockerfile --tag goals-ac-api:ci .
      - name: Build frontend image
        run: docker build --file artifacts/goals-ac/Dockerfile --tag goals-ac-web:ci .
